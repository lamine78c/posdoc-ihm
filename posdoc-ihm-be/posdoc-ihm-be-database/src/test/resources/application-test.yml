logging.level:
  fr.acoss.posdoc: DEBUG

spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  datasource:
    jndi-name: false
    url: "jdbc:h2:mem:testdb"
    username: "sa"
    password: "sa"
    driver-class-name: org.h2.Driver


  h2:
    console:
      enabled: true
      path: "/console"
      settings:
        web-allow-others: true

adelaide-server:
  export-path: "/Export"

notices:
  directory: "src/test/resources/upload/notices/"
  file:
    max-size: 5MB

query:
  results:
    max-size: 200000