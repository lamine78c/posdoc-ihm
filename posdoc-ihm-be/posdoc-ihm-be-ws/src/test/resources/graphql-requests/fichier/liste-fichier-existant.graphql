    codeOrg
    codeApp
    codeCom
    codeFich
    libFichier
    refImprime
    codeAdr
    codeProd
    refFormat
    typeFormat
    page
    codeClient
    typeMultif
    typeSig
    typeSupport
    codeDocument
    eclatement
    refSupport
    isNotAuthorisedToBeDeleted
  }
}