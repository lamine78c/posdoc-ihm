query getFichiersForUpdatingReference($codesEnv: [String], $codesApp: [String], $refsImp: [String]) {
  getFichiersForUpdatingReference(codesEnv: $codesEnv, codesApp: $codesApp, refsImp: $refsImp) {
    codeEnv
    codeOrg
    codeApp
    codeCom
    codeFich
    libFichier
    refImprime
    codeAdr
    codeProd
    refFormat
    typeFormat
    page
    codeClient
    typeMultif
    typeSig
    typeSupport
    codeDocument
    eclatement
    refSupport
    isNotAuthorisedToBeDeleted
  }
}
