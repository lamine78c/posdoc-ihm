query Query  ($page: Int!, $size: Int!, $sort:[SortInput]!, $criteria: [FilterCriterionInput]!) {
    sitesCNP : sitesCNP(queryParameters: {
        paginationParameters: {
            page: $page
            size: $size
            sort: $sort
        }
        filterCriteria: {
            criteria: $criteria
        }

    }) {
        totalElement
        totalPages
        elements {
            ... on Gamme{
                code
                libelle
                codeVerrou
            }
        }
    }
}