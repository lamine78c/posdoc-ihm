mutation updateMassification($data: [UpdateMassificationInput]!, $codsit: String) {
    updateMassification(data: $data, codsit: $codsit) {
        mascom
        masfic
        codsit
        codenv
        codorg
        codapp
        percod
        codcom
        codfic
        numcom
        pagFic
        pliFic
        codcli
        codbon
        masuti
        libfic
        typsup
    }
}