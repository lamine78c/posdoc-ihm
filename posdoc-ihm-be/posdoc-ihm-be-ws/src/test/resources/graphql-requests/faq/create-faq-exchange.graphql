mutation createFaqExchange($createFaqExchange: CreateFaqExchangeInputDTO!) {
    createFaqExchange(createFaqExchange: $createFaqExchange) {
        id
        path
        question
        answer
        status
        viewCount
        createdBy
        updatedBy
        createdAt
        updatedAt
        exchanges {
            id
            author
            message
            createdAt
        }
    }
}