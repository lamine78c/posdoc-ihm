<div class="global-content">
  <div class="d-flex justify-content-end mb-2">
    <button type="button" class="btn btn-outline-secondary" (click)="printPdf()">
      <i class="icon-b_export_pdf" aria-hidden="true"></i><span>Imprimer PDF</span>
    </button>
  </div>
  <table class="table table-striped table-bordered" aria-describedby="table detail">
    <thead>
      <tr>
        <th>Propriété</th>
        <th>Valeur</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of occurenceData; let i = index" [ngClass]="{ 'odd-row': i % 2 === 0, 'even-row': i % 2 !== 0 }">
        <td>{{ data[0] }}</td>
        <td>{{ data[1] }}</td>
      </tr>
    </tbody>
  </table>
</div>
