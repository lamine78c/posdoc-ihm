<div class="popup_detail">
  <app-popup
    [modalRef]="activeModal"
    [title]="modalTitle"
    [firstButton]="null"
    [secondButton]="{ label: 'Fermer', icone: 'icon-b_cancel' }">

    <h3 class="d-flex mb-3">
      Total articles
      <div class="badge badge-info ml-1 mt-auto">{{ totalArticles }}</div>
    </h3>

    <div class="table-wrapper">
      <table class="table table-striped table-bordered" aria-describedby="table commandes">
        <thead>
          <tr>
            <th class="col-commande">Commande</th>
            <th class="col-designation">Désignation</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of rowData; let i = index" [ngClass]="{ 'odd-row': i % 2 === 0, 'even-row': i % 2 !== 0 }">
            <td class="col-commande">{{ data.codcom }}</td>
            <td class="col-designation">{{ data.libcom }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </app-popup>
</div>
