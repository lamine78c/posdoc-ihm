<div class="global-content">
  <div class="normal-content">
    <app-massification-search (applySearchEvent)="searchRessource($event)"></app-massification-search>
  </div>

  <div class="normal-content">
    <h3 class="d-flex">
      Total articles :
      <div class="badge badge-info custom-margin mt-auto">{{ nombreRessourceTotal }}</div>
    </h3>
  </div>

  <div class="remain-content">
    Tableau des massifications
    <app-tableau
      [gridOptions]="gridOptions"
      [rowData]="rowData"
      [overlayNoRowsTemplate]="overlayNoRowsTemplate"
      [columnDefs]="columnDefs"
      [pagination]="false"
      [enableExportButtons]="true"
      [disablePdfExportButton]="true"
      (gridReady)="onGridReady($event)"
      (exportAsExcel)="openExportModal($event)"
    ></app-tableau>
  </div>
</div>

<ng-template #excelExportPopup let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Choisissez le type d'export Excel :</h4>
  </div>
  <div class="modal-body">
    <div class="is-expanded-export">
      <app-boutons-radio-label
        [formGroup]="isExportExpandedForm"
        [controlName]="'isExpanded'"
        [radioLabelList]="radioLabelList"
      ></app-boutons-radio-label>
    </div>
  </div>
  <div class="modal-footer">
    <div class="button-group">
      <button type="button" class="btn btn-outline-primary" (click)="modal.dismiss('cancel')">
        <i class="icon-b_cancel"></i><span>Abandonner</span>
      </button>
      <button [disabled]="!isExpandedFormValid()" type="button" class="btn btn-primary" (click)="modal.close('modal ok')">Valider</button>
    </div>
  </div>
</ng-template>

<ng-template #searchConfirmationPopup let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Le résultat de la recherche contient plus de 10000 résultats</h4>
  </div>
  <div class="modal-body">
    <p>La recherche peut prendre un certain temps. Êtes-vous sûr(e) de vouloir continuer ?</p>
  </div>
  <div class="modal-footer">
    <div class="button-group">
      <button type="button" class="btn btn-outline-primary" (click)="modal.dismiss('cancel')">
        <i class="icon-b_cancel"></i><span>Abandonner</span>
      </button>
      <button type="button" class="btn btn-primary" (click)="modal.close('modal ok')">Valider</button>
    </div>
  </div>
</ng-template>
