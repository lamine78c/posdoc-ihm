<div class="row pt-1 normal-content">
  <div class="col-125 p-0">
    <div class="form-group d-flex align-items-center">
      <label class="col-3 col-form-label">Date:</label>
      <div class="col-9">
        <app-date-picker [currentDate]="formDat" [maxDate]="toMaxDate"></app-date-picker>
      </div>
    </div>
  </div>
  <div class="col-125 p-0">
    <app-liste-deroulante-hierarchisee
      sessionDataSearchDirective
      [form]="formOrg"
      [formIndex]="indexForm.ORGANISME"
      [label]="'Organismes:'"
      [defaultText]="' '"
      [labelColumns]="6"
      [inputColumns]="6"
      [isError]="false"
      [isWithValidAndRAZBtn]="false"
      (changeEvent)="onChangeOrganisme($event)"
    ></app-liste-deroulante-hierarchisee>
  </div>
  <div class="col-125 p-0">
    <app-liste-deroulante
      [label]="'Application:'"
      [blankOptionValue]="' '"
      [form]="formApp"
      [isError]="false"
      [options]="optionsApp"
      [labelColumns]="6"
      [hasBlankOption]="true"
      [inputColumns]="6"
    ></app-liste-deroulante>
  </div>
  <div class="col-125 p-0">
    <app-liste-deroulante
      [label]="'Commande:'"
      [blankOptionValue]="' '"
      [form]="formCom"
      [isError]="false"
      [options]="optionsCom"
      [labelColumns]="6"
      [hasBlankOption]="true"
      [inputColumns]="6"
    ></app-liste-deroulante>
  </div>
  <div class="col-125">
    <app-select-from-table-list
      [label]="'Document:'"
      [form]="formDoc"
      [isError]="false"
      [options]="optionsDoc"
      [labelColumns]="6"
      [inputColumns]="6"
    ></app-select-from-table-list>
  </div>
  <div class="col-125">
    <app-liste-deroulante
      [label]="'Type:'"
      [blankOptionValue]="' '"
      [form]="formTyp"
      [isError]="false"
      [options]="optionsTyp"
      [labelColumns]="4"
      [hasBlankOption]="true"
      [inputColumns]="8"
    ></app-liste-deroulante>
  </div>
  <div class="col-125 p-0">
    <app-liste-deroulante
      [label]="'Statut:'"
      [blankOptionValue]="' '"
      [form]="formSta"
      [isError]="false"
      [options]="optionsSta"
      [labelColumns]="4"
      [hasBlankOption]="true"
      [inputColumns]="8"
    ></app-liste-deroulante>
  </div>
  <div class="col-125 p-0">
    <div class="button-group float-end">
      <button type="button" class="btn btn-primary btn-recherche" [disabled]="!isFormValid()" (click)="lister()">
        <i class="icon-b_search" aria-hidden="true"></i><span>Rechercher</span>
      </button>
    </div>
  </div>
</div>
