<div class="row pt-2 normal-content">
  <div class="col-3 p-0">
    <app-champ-de-saisie-auto-completion
      [label]="'Utilisateur:'"
      [index]="1"
      [form]="formUser"
      [labelColumns]="5"
      [labelClass]="'pl-0'"
      [inputColumns]="7"
      [autoCompleteResults]="optionsUser"
      [editable]="false"
      [placeholder]="'auto-completion'"
      [isError]="true"
      [errorMessage]="formUser.errors?.message || formUser.errors"
    ></app-champ-de-saisie-auto-completion>
  </div>
  <div class="col-3 p-0">
    <app-liste-deroulante
      [label]="'Formulaire:'"
      [form]="formEntity"
      [options]="optionsEntity"
      [labelColumns]="5"
      [inputColumns]="7"
      [blankOptionValue]="''"
      [hasBlankOption]="true"
      [isError]="true"
      [errorMessage]="formEntity.errors?.message || formEntity.errors"
    ></app-liste-deroulante>
  </div>
  <div class="col-3 p-0">
    <app-liste-deroulante
      [label]="'Action:'"
      [form]="formAction"
      [options]="optionsAction"
      [labelColumns]="4"
      [inputColumns]="8"
      [blankOptionValue]="''"
      [hasBlankOption]="true"
      [isError]="true"
      [errorMessage]="formAction.errors?.message || formAction.errors"
    ></app-liste-deroulante>
  </div>
  <div class="col-3 p-0">
    <app-champ-de-saisie-date-intervalle
      [formFrom]="formFromDate"
      [formTo]="formToDate"
      [fromMaxDate]="fromMaxDate"
      [toMaxDate]="toMaxDate"
    ></app-champ-de-saisie-date-intervalle>
  </div>
</div>
<div class="row pt-2 normal-content">
  <div class="col-3 p-0">
    <app-liste-deroulante
      [label]="'Anomalie:'"
      [form]="formResult"
      [options]="optionsResult"
      [labelColumns]="5"
      [labelClass]="'pl-0'"
      [inputColumns]="7"
      [blankOptionValue]="''"
      [hasBlankOption]="true"
      [isError]="true"
      [errorMessage]="formResult.errors?.message || formResult.errors"
    ></app-liste-deroulante>
  </div>
  <div class="col-2">
    <div class="button-group ms-auto">
      <button type="button" class="btn btn-primary btn-recherche" [disabled]="!isFormValid()" (click)="lister()">
        <i class="icon-b_search" aria-hidden="true"></i><span>Rechercher</span>
      </button>
    </div>
  </div>
</div>
