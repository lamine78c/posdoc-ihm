<div class="global-content">
  <div *ngIf="!occurenceData.length" class="alert alert-warning">Aucun incident</div>
  <table appResizableColumn *ngIf="occurenceData.length" class="table table-striped table-bordered" aria-describedby="table incident">
    <thead>
      <tr>
        <th>Date</th>
        <th>Message</th>
        <th>Script</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of occurenceData; let i = index" [ngClass]="{ 'odd-row': i % 2 === 0, 'even-row': i % 2 !== 0 }">
        <td>{{ data.date }}</td>
        <td>{{ data.message }}</td>
        <td>{{ data.script }}</td>
      </tr>
    </tbody>
  </table>
</div>
