<div class="global-content">
  <table class="table table-striped table-bordered" aria-describedby="table detail">
    <thead>
      <tr>
        <th>Propriété</th>
        <th>Valeur</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of videoStepDetailsFichier; let i = index" [ngClass]="{ 'odd-row': i % 2 === 0, 'even-row': i % 2 !== 0 }">
        <td>{{ data[0] }}</td>
        <td>{{ data[1] }}</td>
      </tr>
    </tbody>
  </table>
</div>
