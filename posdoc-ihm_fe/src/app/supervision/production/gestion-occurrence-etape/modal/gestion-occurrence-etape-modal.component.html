<div class="popup_detail">
  <app-popup [modalRef]="activeModal" [title]="modalTitle" [firstButton]="null" [secondButton]="null">
    <div class="popup-tableau">
      <app-tableau
        [gridOptions]="gridOptions"
        [rowData]="searchOccurrenceEtapeResponse"
        [columnDefs]="columnDefs"
        [overlayNoRowsTemplate]="overlayNoRowsTemplate"
        [pagination]="true"
        (gridReady)="onGridReady($event)"
      ></app-tableau>
    </div>

    <div class="row pt-1 pl-1">
      <div class="card col-4">
        <div class="card-body">
          <div class="row">
            <div class="col-5 p-0">
              <app-liste-deroulante
                [label]="'Statut :'"
                [blankOptionValue]="' '"
                [form]="form.get('statut')"
                [isError]="true"
                [options]="optionsStatut"
                [labelColumns]="6"
                [hasBlankOption]="true"
                [inputColumns]="6"
                [errorMessage]="form.get('statut').errors?.message || form.get('statut').errors"
              ></app-liste-deroulante>
            </div>
            <div class="col-3">
              <button type="button" class="btn btn-primary" (click)="appliquer()" [disabled]="!isAppliquerAuthorised()">
                <i class="icon-b_valid"></i><span>Appliquer</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="col-2 p-0 d-flex align-items-center justify-content-center">
        <button type="button" class="btn btn-primary" (click)="valider()" [disabled]="!isValiderAuthorised()">
          <i class="icon-b_valid"></i><span>Valider</span>
        </button>
      </div>
      <div *ngIf="displayFilterButton" class="col-2 p-0 d-flex align-items-center justify-content-center">
        <button type="button" class="btn btn-primary" (click)="goToGestionOccurrenceEtape()"><i class="icon-b_valid"></i><span>Filtrer</span></button>
      </div>
    </div>

    <div class="modal-footer">
      <div class="button-group">
        <button type="button" class="btn btn-outline-primary" (click)="dismissPopup()"><i class="icon-b_cancel"></i><span>Fermer</span></button>
      </div>
    </div>
  </app-popup>
</div>
