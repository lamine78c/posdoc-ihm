<div class="popup-ajout">
  <app-popup [modalRef]="activeModal" [title]="title" [firstButton]="null" [secondButton]="null">
    <div class="normal-content">
      <app-search-affectation-notice
        [isPopupAjout]="true"
        [isSomeChangeNotSubmited]="isSomeChangeNotSubmited"
        (applySearchEvent)="lister($event)"
      ></app-search-affectation-notice>
    </div>
    <div class="normal-content">
      <h3 class="d-flex">
        Total articles :
        <div class="badge badge-info badge-ml">{{ totalNotices }}</div>
      </h3>
    </div>
    <div class="remain-content">
      <app-tableau
        [gridOptions]="gridOptions"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [overlayNoRowsTemplate]="overlayNoRowsTemplate"
        [pagination]="false"
        [enableExportButtons]="false"
        [enableFullEdit]="false"
        [asynchronousErrors$]="asynchronousErrors$"
        (gridReady)="onGridReady($event)"
      ></app-tableau>
    </div>

    <div class="row pt-2 normal-content">
      <div class="col-flex d-flex p-0 m-2">
        <label class="col-6 col-form-label">Date début: </label>
        <div class="col-6 position-relative"><app-date-picker [currentDate]="form.get('dateDeb')"></app-date-picker></div>
      </div>
      <div class="col-flex d-flex p-0 m-2">
        <label class="col-6 col-form-label">Date fin: </label>
        <div class="col-6 position-relative"><app-date-picker [currentDate]="form.get('dateFin')" [minDate]="toMinDate"></app-date-picker></div>
      </div>
      <div class="col-flex d-flex p-0 m-2">
        <button type="button" class="btn btn-primary" (click)="updateDateIhm()" [disabled]="!isApply()">
          <i class="icon-b_valid"></i><span>Appliquer</span>
        </button>
        <button type="button" class="btn btn-primary ms-3" (click)="validerEnMasse()" [disabled]="!isValid()">
          <i class="icon-b_valid"></i><span>Valider</span>
        </button>
      </div>
    </div>
  </app-popup>
  <div class="modal-footer">
    <div class="button-group">
      <button type="button" class="btn btn-outline-primary" (click)="closePopup()"><i class="icon-b_cancel"></i><span>Fermer</span></button>
    </div>
  </div>
</div>
