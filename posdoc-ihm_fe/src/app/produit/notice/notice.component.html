<app-onglet [type]="ongletTypeEnum.PREMIER_NIVEAU" [tabs]="onglets" [active]="active" (activeChange)="activeChange($event)">
  <ng-container *ngFor="let onglet of onglets; index as index">
    <app-onglet-header-container *appCheckPermission="onglet.perm">
      <app-onglet-header class="d-flex" [tab]="onglet" [type]="ongletTypeEnum.PREMIER_NIVEAU"></app-onglet-header>
    </app-onglet-header-container>
  </ng-container>

  <div class="onglet" *ngIf="labelActif === ongletNumEnum.ONGLET_NUMBER_NOTICE_ACTIVE">
    <app-tableau-notice [isNoticesActives]="true"></app-tableau-notice>
  </div>

  <div class="onglet" *ngIf="labelActif === ongletNumEnum.ONGLET_NUMBER_NOTICE_PERIMEE">
    <app-tableau-notice [isNoticesActives]="false"></app-tableau-notice>
  </div>

  <div class="onglet" *ngIf="labelActif === ongletNumEnum.ONGLET_NUMBER_AFF_NOTICE">
    <app-affectation-notice></app-affectation-notice>
  </div>

  <div class="onglet" *ngIf="labelActif === ongletNumEnum.ONGLET_NUMBER_NOTICES_FICHIERS">
    <app-notices-fichiers></app-notices-fichiers>
  </div>
</app-onglet>
