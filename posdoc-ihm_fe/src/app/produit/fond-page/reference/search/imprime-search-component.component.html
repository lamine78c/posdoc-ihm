<div class="row pt-1 normal-content" [ngClass]="{ 'div-search-disabled': isSearchDisabled }">
  <div class="col-3 p-0">
    <app-liste-deroulante-multiple
      [label]="'Environnement réf. :'"
      [form]="formGroup.get('environnement')"
      [labelWidth]="151"
      [labelClass]="'pl-0'"
      [hasBlankOption]="false"
      [isWithValidAndRAZBtn]="false"
      (changeEvent)="onChangeEnvironnement($event)"
    ></app-liste-deroulante-multiple>
  </div>

  <div class="col-3 p-0">
    <app-liste-deroulante
      [label]="'Application réf. :'"
      [form]="getApplicationsControls()"
      [hasBlankOption]="true"
      [blankOptionValue]="''"
      [options]="applications"
      [labelWidth]="151"
      (changeEvent)="onChangeApplication($event)"
    ></app-liste-deroulante>
  </div>

  <div class="col-3 p-0">
    <app-liste-deroulante
      [label]="'Référence imprimé :'"
      [form]="getReferencesControls()"
      [hasBlankOption]="true"
      [blankOptionValue]="''"
      [isLoadingOptions]="isLoadingOptions"
      [options]="references"
      [labelWidth]="151"
      (changeEvent)="onChangeReference($event)"
    ></app-liste-deroulante>
  </div>

  <div class="col-2 p-0 d-flex align-items-end">
    <button (click)="lister($event)" type="button" class="btn btn-primary btn-recherche mb-1" [disabled]="!isSearchValid()">
      <i class="icon-b_search" aria-hidden="true"></i><span>Rechercher</span>
    </button>
  </div>
</div>
