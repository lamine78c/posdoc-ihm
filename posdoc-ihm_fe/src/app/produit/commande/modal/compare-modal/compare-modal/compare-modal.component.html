<app-popup [modalRef]="modalRef" [isFormValid]="isFormValid" [title]="title" [firstButton]="null" [secondButton]="null">
  <app-search-commande-compare-modal
    [environnementList]="environnementList"
    [allOrgReg]="allOrgReg"
    (applyCommandeEvent)="lister($event)"
  ></app-search-commande-compare-modal>

  <div [style.height.px]="gridHeight()">
    <app-tableau
      [gridOptions]="gridOptions"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [overlayNoRowsTemplate]="overlayNoRowsTemplate"
      [pagination]="true"
      [enableExportButtons]="!!this.rowData.length"
      [disablePdfExportButton]="true"
      [asynchronousErrors$]="asynchronousErrors$"
      (gridReady)="onGridReady($event)"
      (exportAsExcel)="exportDetails($event)"
    ></app-tableau>
  </div>
</app-popup>

<div class="modal-footer">
  <div class="button-group">
    <button type="button" class="btn btn-outline-primary" (click)="closePopup()" *ngIf="secondButton">
      <i class="icon-b_cancel" aria-hidden="true"></i><span>{{ secondButton.label }}</span>
    </button>
  </div>
</div>
