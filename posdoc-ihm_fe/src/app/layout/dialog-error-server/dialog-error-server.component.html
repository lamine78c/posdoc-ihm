<app-popup [modalRef]="modalRef" [title]="'Le serveur ne répond pas'" [firstButton]="null" [secondButton]="null">
  Nous rencontrons un problème technique, le serveur ne répond pas.
</app-popup>

<div class="modal-footer">
  <div class="button-group">
    <button type="button" class="btn btn-primary" (click)="closePopup()"><i class="icon-b_valid" aria-hidden="true"></i><span>Fermer</span></button>
  </div>
</div>
